# DocMind 专属 Milvus 单机栈（独立于其他项目，宿主端口 19531/9092）
services:
  docmind-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: docmind-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - docmind_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://docmind-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  docmind-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: docmind-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - docmind_minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  docmind-milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: docmind-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: docmind-etcd:2379
      MINIO_ADDRESS: docmind-minio:9000
    volumes:
      - docmind_milvus_data:/var/lib/milvus
    ports:
      - "19531:19530"
      - "9092:9091"
    depends_on:
      - docmind-etcd
      - docmind-minio
    restart: unless-stopped

volumes:
  docmind_etcd_data:
  docmind_minio_data:
  docmind_milvus_data:
